name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # typecheck + tests + build + facade typecheck/tests
      - run: npm run check
      # Pi installs git packages without building, so the committed dist/ must match the source.
      - name: Committed dist/ is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: git diff --exit-code --stat -- dist
